<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Новобранець</title>
<style>
  :root {
    --bg: #14140f;
    --panel: #1c1c16;
    --line: #33332a;
    --ink: #e6e2d4;
    --dim: #8d8977;
    --warn: #c9563f;
    --good: #7e9b62;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root { --accent: #e0b04a; --accent-rgb: 224,176,74; --fog-rgb: 176,160,120; --ka: #e0b04a; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: radial-gradient(ellipse 90% 38% at 50% 0%, rgba(var(--accent-rgb), .13), transparent 72%), var(--bg);
    background-attachment: fixed; color: var(--ink);
    font-family: "Georgia", "Times New Roman", serif;
    overscroll-behavior: none;
  }
  body { display: flex; flex-direction: column; min-height: 100dvh; }
  .wrap { width: 100%; max-width: 520px; margin: 0 auto; padding: 0 16px; }

  header {
    padding: 14px 0 10px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; justify-content: space-between;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px;
    color: var(--dim); letter-spacing: .06em; text-transform: uppercase;
  }
  header .day { color: var(--ink); }

  .stats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; padding: 12px 0; }
  .stat { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
  .stat .bar {
    width: 100%; height: 26px; background: #22221a; border-radius: 2px;
    position: relative; overflow: hidden; transition: box-shadow .3s;
  }
  .stat .fill { position: absolute; bottom: 0; left: 0; right: 0; background: var(--dim); transition: height .3s ease; }
  .stat .label { font-family: ui-monospace, monospace; font-size: 9px; color: var(--dim); letter-spacing: .04em; }
  .stat .val { font-family: ui-monospace, monospace; font-size: 10px; color: var(--ink); }
  .stat .fill { opacity: .9; }
  .stat .bar { box-shadow: inset 0 0 0 1px rgba(255,255,255,.04); }
  .stat .delta {
    position: absolute; top: -14px; left: 0; right: 0; text-align: center;
    font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600;
    animation: floatUp 1.6s ease-out forwards; pointer-events: none;
  }
  .stat.up .delta { color: var(--good); }
  .stat.down .delta { color: var(--warn); }
  .stat.up .fill { box-shadow: 0 0 0 1px rgba(126,155,98,.75); }
  .stat.down .fill { box-shadow: 0 0 0 1px rgba(201,86,63,.75); }
  @keyframes floatUp {
    0% { opacity: 0; transform: translateY(4px); }
    15% { opacity: 1; transform: translateY(0); }
    70% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-6px); }
  }

  main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 18px 0; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-top: 2px solid var(--ka); border-radius: 4px;
    font-size: 18px; line-height: 1.55; overflow: hidden; display: block;
    animation: in .32s ease-out; box-shadow: 0 10px 34px -18px rgba(var(--accent-rgb), .45);
  }
  .card-body { padding: 18px 20px 22px; }
  .scene { position: relative; height: 104px; background: #111; }
  .scene svg.scenery { position: absolute; inset: 0; width: 100%; height: 100%; }
  .scene .kind, .scene .tod {
    position: absolute; top: 8px; font-family: ui-monospace, monospace; font-size: 9px; letter-spacing: .12em;
    text-transform: uppercase; padding: 2px 6px; border-radius: 2px; background: rgba(10,10,8,.55); backdrop-filter: blur(2px);
  }
  .scene .kind { left: 10px; color: var(--ka); border: 1px solid var(--ka); }
  .scene .tod { right: 10px; color: #cfc9b4; }
  @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .card.leaving, main.leaving { opacity: 0; transform: translateY(-8px); transition: opacity .16s, transform .16s; }
  .card .lead {
    font-family: ui-monospace, monospace; font-size: 10px; line-height: 1.5;
    color: #9d967c; border-bottom: 1px solid var(--line);
    padding-bottom: 8px; margin-bottom: 12px; letter-spacing: .02em;
  }

  .options { display: flex; flex-direction: column; gap: 9px; margin-top: 14px; }
  button.opt {
    font: inherit; font-size: 15px; line-height: 1.4; text-align: left;
    background: #201f18; color: var(--ink); border: 1px solid var(--line);
    border-radius: 3px; padding: 13px 14px; cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  button.opt:hover { background: #282619; border-color: var(--accent); }
  .options button.opt { animation: in .38s ease-out both; animation-delay: calc(var(--i, 0) * 80ms + 120ms); }
  button.opt .opt-text { display: block; }
  button.opt:active { transform: scale(.995); }
  button.opt.locked { color: #555244; border-style: dashed; cursor: not-allowed; }
  button.opt .hint { display: block; font-size: 11px; color: var(--dim); margin-top: 5px; font-family: ui-monospace, monospace; }
  button.opt.chosen {
    background: #2c3220; border-color: var(--good); color: var(--ink);
    box-shadow: inset 0 0 0 1px var(--good);
  }
  button.opt.chosen::before { content: '➜ '; color: var(--good); }
  button.opt.faded { opacity: .28; transition: opacity .2s; }

  button.opt.ghost { border-left: 3px solid #6f6b58; }
  button.opt .ghost-tag { display: block; font-size: 11px; color: var(--dim); margin-top: 5px; font-family: ui-monospace, monospace; }
  .branches { margin: 14px 0; }
  .branch { display: flex; flex-direction: column; gap: 2px; padding: 8px 0 8px 10px; margin-bottom: 8px; border-left: 2px solid #e0b04a; font-size: 13px; }
  .branch .arrow { font-family: ui-monospace, monospace; font-size: 10px; color: var(--dim); }

  /* «Погода» вибору: маленькі стовпчики напрямку показників. */
  button.opt { position: relative; }
  button.opt .weather {
    display: block; margin-top: 7px; opacity: .55;
    transition: opacity .15s;
  }
  button.opt:hover .weather { opacity: .95; }
  button.opt.locked .weather { opacity: .22; }
  .echo {
    margin: 0 0 12px; padding: 8px 0 8px 10px;
    border-left: 2px solid #4a4a38; font-size: 14px; font-style: italic;
    color: #a8a28c;
  }
  .outcome {
    padding: 18px 16px 14px; border: 1px solid var(--line);
    border-left: 3px solid var(--good); border-radius: 4px; background: #191911;
    animation: in .2s ease-out;
  }
  .outcome .o-head {
    font-family: ui-monospace, monospace; font-size: 10px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--good); margin-bottom: 12px;
  }
  .outcome .o-text { font-size: 17px; line-height: 1.55; margin: 0 0 12px; }
  .outcome .o-voice {
    font-style: italic; color: #b0ab94; margin: 0 0 12px; font-size: 14px;
    border-left: 2px solid var(--line); padding-left: 10px;
  }
  .outcome .o-choice {
    font-family: ui-monospace, monospace; font-size: 11px; color: #6f6b58;
    border-top: 1px solid var(--line); padding-top: 10px; line-height: 1.5;
  }

  figure.photo { margin: 0 0 14px; }
  figure.photo img {
    display: block; width: 100%; height: auto; max-height: 230px; object-fit: cover;
    border-radius: 3px; border: 1px solid var(--line);
    filter: grayscale(.45) contrast(1.02) brightness(.92);
  }
  figure.photo figcaption {
    font-family: ui-monospace, monospace; font-size: 9.5px; color: #6f6b58;
    padding-top: 5px; line-height: 1.5;
  }
  figure.photo figcaption span { color: #55523f; }

  .reaction {
    margin-top: 14px; padding: 14px 14px 12px; border: 1px solid var(--line);
    border-left: 2px solid var(--good); border-radius: 3px; background: #191911;
    animation: in .2s ease-out;
  }
  .reaction .r-choice {
    font-family: ui-monospace, monospace; font-size: 11px; color: var(--good);
    margin-bottom: 8px; line-height: 1.4;
  }
  .reaction .r-line { font-size: 15px; line-height: 1.5; font-style: italic; color: var(--ink); }
  .reaction .r-changes {
    margin-top: 9px; font-family: ui-monospace, monospace; font-size: 11px;
    color: var(--dim); line-height: 1.6;
  }
  button.r-next {
    margin-top: 12px; width: 100%; background: transparent; color: var(--ink);
    border: 1px solid var(--line); border-radius: 3px; padding: 11px;
    font: inherit; font-size: 14px; cursor: pointer;
  }
  button.r-next:hover { background: #22220f; border-color: #4a4634; }

  .log { font-family: ui-monospace, monospace; font-size: 11px; color: var(--dim); padding: 8px 0 4px; }
  .log div { opacity: .55; padding: 2px 0; }
  .log div:first-child { opacity: .9; color: #b0ab94; }


  /* ---- Мряка: шари позаду контенту + легка пелена поверх + темні краї ---- */
  #mist { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  .fog { position: fixed; inset: -25%; pointer-events: none; z-index: 0; opacity: .3; transition: opacity 2.4s ease; will-change: transform; }
  .fog1 {
    background:
      radial-gradient(ellipse 55% 40% at 30% 40%, rgba(var(--fog-rgb),.55), transparent 70%),
      radial-gradient(ellipse 50% 35% at 78% 72%, rgba(var(--fog-rgb),.45), transparent 70%);
    animation: drift1 70s ease-in-out infinite alternate;
  }
  .fog2 {
    background:
      radial-gradient(ellipse 60% 30% at 62% 24%, rgba(160,165,150,.45), transparent 70%),
      radial-gradient(ellipse 45% 40% at 18% 82%, rgba(120,128,116,.45), transparent 70%);
    animation: drift2 95s ease-in-out infinite alternate;
  }
  @keyframes drift1 { from { transform: translate3d(-4%, 0, 0); } to { transform: translate3d(5%, 3%, 0); } }
  @keyframes drift2 { from { transform: translate3d(5%, 2%, 0); } to { transform: translate3d(-5%, -3%, 0); } }
  .haze { position: fixed; inset: 0; pointer-events: none; z-index: 3; background: #98a08a; opacity: 0; transition: opacity 2.4s ease; }
  .vignette { position: fixed; inset: 0; pointer-events: none; z-index: 4; background: radial-gradient(ellipse at center, transparent 42%, #000 125%); opacity: 0; transition: opacity 2.8s ease; }
  header.wrap, .wrap, main.wrap, .foot { position: relative; z-index: 2; }
  button.tog {
    font: inherit; font-family: ui-monospace, monospace; font-size: 10px; letter-spacing: .06em; text-transform: uppercase;
    background: transparent; color: var(--dim); border: 1px solid var(--line); border-radius: 3px; padding: 3px 8px; cursor: pointer; margin-left: 10px;
  }
  button.tog[aria-pressed="false"] { opacity: .5; text-decoration: line-through; }
  .hdr-right { display: flex; align-items: baseline; gap: 4px; }
  #route { padding: 8px 0 0; }
  .mood { font-family: ui-monospace, monospace; font-size: 10px; color: #6f6b58; text-align: center; padding: 2px 0 0; letter-spacing: .03em; min-height: 14px; }
  .chart { margin: 16px 0 6px; padding: 12px 10px 6px; border: 1px solid var(--line); border-radius: 4px; background: #191911; }
  .chart .cap { font-size: 13px; line-height: 1.5; color: #b0ab94; padding: 4px 4px 8px; font-style: italic; }
  .chart h3 { margin: 0 0 6px 4px; font: 10px ui-monospace, monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); font-weight: normal; }
  body.nomist #mist, body.nomist .fog, body.nomist .haze { display: none; }

  @media (prefers-reduced-motion: reduce) {
    #mist { display: none; }
    .fog { animation: none !important; }
    * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }

  .ending { padding: 26px 20px; border: 1px solid var(--line); background: var(--panel); border-radius: 4px; }
  .ending h1 { font-size: 24px; margin: 0 0 14px; font-weight: normal; }
  .ending p { line-height: 1.6; margin: 0 0 16px; font-size: 15px; }
  .ending .ep { font-style: italic; color: var(--dim); border-left: 2px solid var(--line); padding-left: 12px; }
  .ending .meta { font-family: ui-monospace, monospace; font-size: 11px; color: var(--dim); margin-bottom: 18px; }
  a.btn, button.btn {
    display: block; width: 100%; text-align: center; text-decoration: none;
    background: var(--ink); color: var(--bg); border: 0; border-radius: 3px;
    padding: 14px; font: inherit; font-size: 15px; cursor: pointer; margin-top: 10px;
  }
  a.btn.second, button.btn.second { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .foot { font-family: ui-monospace, monospace; font-size: 10px; color: #55523f; text-align: center; padding: 12px 0 18px; }
</style>
</head>
<body>

<canvas id="mist" aria-hidden="true"></canvas>
<div class="fog fog1" id="fog1" aria-hidden="true"></div>
<div class="fog fog2" id="fog2" aria-hidden="true"></div>
<div class="haze" id="haze" aria-hidden="true"></div>
<div class="vignette" id="vignette" aria-hidden="true"></div>

<header class="wrap">
  <span>Новобранець</span>
  <span class="hdr-right"><span class="day" id="day">День 1</span><button class="tog" id="mistToggle" aria-pressed="true" title="Мряка й дощ">мряка</button></span>
</header>

<div class="wrap"><div id="route"></div><div class="mood" id="mood"></div></div>

<div class="wrap"><div class="stats" id="stats"></div></div>

<main class="wrap" id="main"></main>

<div class="wrap"><div class="log" id="log"></div></div>
<div class="foot">вигадані люди й частини · смерть гарантована</div>

<script type="module">
// src/types.ts
var STAT_KEYS = [
  "health",
  "energy",
  "supplies",
  "trust",
  "understanding",
  "bonds"
];
var STAT_RANGE = { min: 0, max: 10 };
var SKILL_KEYS = ["survival", "system", "people", "drill"];
var DEFAULT_DIRECTOR = {
  safeUntilDay: 20,
  inevitabilityStartsDay: 30,
  hardEndDay: 60,
  baseFatalChance: 0.012,
  rampPerDay: 0.01,
  maxFatalChance: 0.32
};

// src/conditions.ts
function meetsCondition(cond, stats, skills, flags, phase, day) {
  if (!cond) return true;
  if (cond.statAtLeast) {
    for (const [k, v] of Object.entries(cond.statAtLeast)) {
      if (stats[k] < v) return false;
    }
  }
  if (cond.statAtMost) {
    for (const [k, v] of Object.entries(cond.statAtMost)) {
      if (stats[k] > v) return false;
    }
  }
  if (cond.skillAtLeast) {
    for (const [k, v] of Object.entries(cond.skillAtLeast)) {
      if (skills[k] < v) return false;
    }
  }
  if (cond.flagTrue) {
    for (const f2 of cond.flagTrue) if (flags[f2] !== true) return false;
  }
  if (cond.flagFalse) {
    for (const f2 of cond.flagFalse) if (flags[f2] === true) return false;
  }
  if (cond.phaseAtLeast !== void 0 && phase < cond.phaseAtLeast) return false;
  if (cond.phaseAtMost !== void 0 && phase > cond.phaseAtMost) return false;
  if (cond.dayAtLeast !== void 0 && day < cond.dayAtLeast) return false;
  if (cond.dayAtMost !== void 0 && day > cond.dayAtMost) return false;
  if (cond.anySkillAtLeast) {
    const ok = cond.anySkillAtLeast.some((c2) => skills[c2.key] >= c2.level);
    if (!ok) return false;
  }
  return true;
}
function clampStats(stats, range = STAT_RANGE) {
  const out = { ...stats };
  for (const k of STAT_KEYS) {
    out[k] = Math.max(range.min, Math.min(range.max, out[k]));
  }
  return out;
}
function applyEffect(effect, stats, skills, flags, range = STAT_RANGE) {
  if (!effect) return { stats, skills, flags };
  const nextStats = { ...stats };
  if (effect.stats) {
    for (const [k, v] of Object.entries(effect.stats)) {
      nextStats[k] += v;
    }
  }
  const nextSkills = { ...skills };
  if (effect.skills) {
    for (const [k, v] of Object.entries(effect.skills)) {
      nextSkills[k] = Math.max(0, Math.min(3, nextSkills[k] + v));
    }
  }
  const nextFlags = { ...flags };
  if (effect.flags) {
    for (const [k, v] of Object.entries(effect.flags)) nextFlags[k] = v;
  }
  return { stats: clampStats(nextStats, range), skills: nextSkills, flags: nextFlags };
}
var STAT_NAMES = {
  health: "\u0417\u0434\u043E\u0440\u043E\u0432\u2019\u044F",
  energy: "\u0411\u0430\u0434\u044C\u043E\u0440\u0456\u0441\u0442\u044C",
  supplies: "\u0417\u0430\u043F\u0430\u0441\u0438",
  trust: "\u0414\u043E\u0432\u0456\u0440\u0430",
  understanding: "\u0420\u043E\u0437\u0443\u043C\u0456\u043D\u043D\u044F",
  bonds: "\u0417\u0432\u2019\u044F\u0437\u043A\u0438"
};
var SKILL_NAMES = {
  survival: "\u0412\u0438\u0436\u0438\u0432\u0430\u043D\u043D\u044F",
  system: "\u0421\u0438\u0441\u0442\u0435\u043C\u0430",
  people: "\u041B\u044E\u0434\u0438",
  drill: "\u041C\u0443\u0448\u0442\u0440\u0430"
};
function describeRequirement(cond) {
  if (!cond) return "";
  const parts = [];
  for (const [k, v] of Object.entries(cond.statAtLeast ?? {})) {
    parts.push(`${STAT_NAMES[k]} \u2265 ${v}`);
  }
  for (const [k, v] of Object.entries(cond.statAtMost ?? {})) {
    parts.push(`${STAT_NAMES[k]} \u2264 ${v}`);
  }
  for (const [k, v] of Object.entries(cond.skillAtLeast ?? {})) {
    parts.push(`\u043D\u0430\u0432\u0438\u0447\u043A\u0430 \xAB${SKILL_NAMES[k]}\xBB \u2265 ${v}`);
  }
  if (cond.anySkillAtLeast?.length) {
    parts.push(cond.anySkillAtLeast.map((c2) => `\xAB${SKILL_NAMES[c2.key]}\xBB \u2265 ${c2.level}`).join(" \u0430\u0431\u043E "));
  }
  if ((cond.flagTrue ?? []).length > 0) parts.push("\u043F\u043E\u0442\u0440\u0456\u0431\u0435\u043D \u0432\u0447\u0438\u043D\u043E\u043A, \u044F\u043A\u043E\u0433\u043E \u0442\u0438 \u0449\u0435 \u043D\u0435 \u0437\u0440\u043E\u0431\u0438\u0432");
  if ((cond.flagFalse ?? []).length > 0) parts.push("\u0448\u043B\u044F\u0445 \u0437\u0430\u043A\u0440\u0438\u0442\u043E \u0442\u0432\u043E\u0457\u043C \u043F\u043E\u043F\u0435\u0440\u0435\u0434\u043D\u0456\u043C \u0432\u0438\u0431\u043E\u0440\u043E\u043C");
  if (cond.dayAtLeast !== void 0) parts.push(`\u043D\u0435 \u0440\u0430\u043D\u0456\u0448\u0435 \u0434\u043D\u044F ${cond.dayAtLeast}`);
  if (cond.dayAtMost !== void 0) parts.push(`\u043D\u0435 \u043F\u0456\u0437\u043D\u0456\u0448\u0435 \u0434\u043D\u044F ${cond.dayAtMost}`);
  return parts.length ? `\u043F\u043E\u0442\u0440\u0456\u0431\u043D\u043E: ${parts.join(", ")}` : "";
}

// src/rng.ts
function nextRandom(state) {
  let t = state + 1831565813 | 0;
  let x = t;
  x = Math.imul(x ^ x >>> 15, 1 | x);
  x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x;
  const value = ((x ^ x >>> 14) >>> 0) / 4294967296;
  return { value, state: t };
}
function seedToState(seed) {
  let h = 2166136261;
  for (let i = 0; i < seed.length; i += 1) {
    h ^= seed.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function createRng(seed) {
  let state = seedToState(seed);
  const float = () => {
    const r = nextRandom(state);
    state = r.state;
    return r.value;
  };
  return {
    float,
    int: (min, max) => min + Math.floor(float() * (max - min + 1)),
    pick: (items) => {
      if (items.length === 0) throw new Error("pick() from empty array");
      return items[Math.floor(float() * items.length)];
    },
    chance: (p) => float() < p,
    state: () => state
  };
}

// src/run.ts
var TROUGH_FAVOR = 6;
var TROUGH_CHANCE_BASE = 0.45;
var TROUGH_CHANCE_STEP = 0.03;
var TROUGH_CHANCE_MAX = 0.85;
var RECENT_WINDOW = 4;
var PHASE_BY_DAY = [
  { until: 3, phase: 1 },
  { until: 12, phase: 2 },
  { until: 24, phase: 3 },
  { until: 40, phase: 4 },
  { until: Number.MAX_SAFE_INTEGER, phase: 5 }
];
function phaseForDay(day) {
  for (const p of PHASE_BY_DAY) if (day <= p.until) return p.phase;
  return 5;
}
var DEFAULT_STATS = {
  health: 7,
  energy: 7,
  supplies: 5,
  trust: 6,
  understanding: 2,
  bonds: 4
};
var Run = class {
  config;
  director;
  statRange;
  cardsPerDay;
  rng;
  cardsById;
  state;
  constructor(config) {
    this.config = config;
    this.director = { ...DEFAULT_DIRECTOR, ...config.director };
    this.statRange = config.statRange ?? STAT_RANGE;
    this.cardsPerDay = config.cardsPerDay ?? { min: 2, max: 3 };
    this.rng = createRng(config.seed);
    this.cardsById = new Map(config.content.cards.map((c2) => [c2.id, c2]));
    const stats = { ...DEFAULT_STATS };

var clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
var PHASE_FOG = [0.16, 0.26, 0.38, 0.5, 0.6];
var PHASE_RAIN = [0.18, 0.3, 0.45, 0.6, 0.75];
function atmosphereFor(state, dir = {}) {
  const safe = dir.safeUntilDay ?? 20;
  const hard = dir.hardEndDay ?? 60;
  const st = state.stats;
  const p = clamp((state.phase ?? 1) - 1, 0, 4);
  const clarity = clamp(st.understanding * 0.035, 0, 0.3);
  const hardship = (10 - st.health) * 0.03 + (10 - st.energy) * 0.025 + (10 - st.supplies) * 0.012;
  const fog = clamp(PHASE_FOG[p] + hardship - clarity, 0.06, 0.92);
  const rain = clamp(PHASE_RAIN[p] + (10 - st.energy) * 0.02, 0.1, 0.95);
  const dark = state.status === "ended" ? 0.9 : clamp((state.day - safe) / (hard - safe), 0, 1) * 0.75;
  let label;
  if (clarity >= 0.2 && fog < 0.4) label = "\u043C\u0440\u044F\u043A\u0430 \u0440\u0456\u0434\u0448\u0430\u0454: \u0442\u0438 \u043F\u043E\u0447\u0438\u043D\u0430\u0454\u0448 \u0431\u0430\u0447\u0438\u0442\u0438";
  else if (fog > 0.7) label = "\u043C\u0440\u044F\u043A\u0430 \u0433\u0443\u0441\u0442\u0430: \u043C\u0430\u0439\u0436\u0435 \u043D\u0456\u0447\u043E\u0433\u043E \u043D\u0435 \u0432\u0438\u0434\u043D\u043E";
  else if (fog > 0.45) label = "\u043C\u0440\u044F\u043A\u0430 \u0441\u0442\u043E\u0457\u0442\u044C";
  else label = "\u043C\u0440\u044F\u043A\u0430 \u043B\u0435\u0433\u043A\u0430";
  return { fog, rain, dark, clarity, label };
}
function approach(current, target, k = 0.06) {
  return Math.abs(target - current) < 2e-3 ? target : current + (target - current) * k;
}

function pathOf(r) {

    const to = byId.get(t.to);
    return `<div class="branch"><span>\u0434${t.fromDay} \xB7 ${escapeHtml(opt?.text ?? t.fromOption)}</span><span class="arrow">\u2193 \u0447\u0435\u0440\u0435\u0437 ${t.day - t.fromDay} \u0434\u043D.</span><span>\u0434${t.day} \xB7 ${escapeHtml((to?.lead ?? to?.text ?? t.to).slice(0, 90))}</span></div>`;

function divergence() {

    if (!now[i] || !ghost[i] || now[i].cardId !== ghost[i].cardId || now[i].optionId !== ghost[i].optionId) {
      const day = (now[i] ?? ghost[i]).day;
      return `\u0422\u0438 \u0440\u043E\u0437\u0456\u0439\u0448\u043E\u0432\u0441\u044F \u0437\u0456 \u0441\u0432\u043E\u0457\u043C \u043C\u0438\u043D\u0443\u043B\u0438\u043C \u0448\u043B\u044F\u0445\u043E\u043C \u043D\u0430 \u0440\u0456\u0448\u0435\u043D\u043D\u0456 \u2116${i + 1} (\u0434\u0435\u043D\u044C ${day}).`;
    }
  }
  return "\u0422\u0438 \u043F\u043E\u0432\u0442\u043E\u0440\u0438\u0432 \u0442\u043E\u0439 \u0441\u0430\u043C\u0438\u0439 \u0448\u043B\u044F\u0445 \u0434\u043E \u043A\u0456\u043D\u0446\u044F.";

function newSeed() {

function escapeHtml(t) {

function renderLog() {

function render() {

    </div>
    <div class="options">
      ${card.options.map((o2, idx) => {
    const tag = ghostPick && ghostPick.optionId === o2.id ? '<span class="ghost-tag">\u21BA \u043C\u0438\u043D\u0443\u043B\u043E\u0433\u043E \u0440\u0430\u0437\u0443 \u0442\u0438 \u043E\u0431\u0440\u0430\u0432 \u0446\u0435</span>' : "";
    const weather = optionWeatherSvg(card.id, o2.id, o2.effects?.stats, understanding);
    return available.has(o2.id) ? `<button class="opt${tag ? " ghost" : ""}" style="--i:${idx}" data-opt="${escapeHtml(o2.id)}"><span class="opt-text">${escapeHtml(o2.text)}</span>${weather}${tag}</button>` : `<button class="opt locked" style="--i:${idx}" disabled><span class="opt-text">${escapeHtml(o2.text)}</span>${weather}<span class="hint">${escapeHtml(run.lockedHint(o2))}</span></button>`;

}
function onChoose(card, btn) {
  if (reactionOpen) return;
  reactionOpen = true;
  const option = card.options.find((o2) => o2.id === btn.dataset.opt);
  if (!option) {
    reactionOpen = false;
    return;
  }
  const before = { ...run.state.stats, ...run.state.skills };
  const fogBefore = atmosphereFor(run.state, run.director).fog;
  if (!run.choose(option.id)) {
    reactionOpen = false;
    return;

  const after = { ...run.state.stats, ...run.state.skills };

  elMain.querySelectorAll("button.opt").forEach((b) => {

    b.classList.add("locked");

  const reaction = buildReaction(option, before, after);
  applyAtmosphere();
  renderRoute();

var NEUTRAL = {

    "\u041D\u0456\u0447\u043E\u0433\u043E \u043D\u0435 \u0432\u0456\u0434\u0431\u0443\u043B\u043E\u0441\u044F. \u0414\u0435\u043D\u044C \u043F\u0456\u0448\u043E\u0432 \u0434\u0430\u043B\u0456, \u044F\u043A \u043F\u0456\u0448\u043E\u0432 \u0431\u0438 \u0439 \u0431\u0435\u0437 \u0442\u0435\u0431\u0435.",
    "\u0420\u0456\u0448\u0435\u043D\u043D\u044F \u0431\u0435\u0437 \u043D\u0430\u0441\u043B\u0456\u0434\u043A\u0456\u0432. \u041F\u043E\u043A\u0438 \u0449\u043E."

    "\u0429\u043E\u0441\u044C \u0437\u043C\u0456\u043D\u0438\u043B\u043E\u0441\u044F. \u041D\u0435 \u0437\u0430\u0432\u0436\u0434\u0438 \u0432 \u0442\u043E\u0439 \u0431\u0456\u043A, \u0443 \u044F\u043A\u0438\u0439 \u0442\u0438 \u0434\u0443\u043C\u0430\u0432.",
    "\u0422\u0438 \u0432\u0438\u0440\u0456\u0448\u0438\u0432. \u041D\u0430\u0441\u043B\u0456\u0434\u043A\u0438 \u0432\u0438\u0440\u0456\u0448\u0443\u0432\u0430\u0442\u0438\u043C\u0443\u0442\u044C \u0437\u0430 \u0442\u0435\u0431\u0435 \u0434\u0430\u043B\u0456.",
    "\u0426\u0435 \u044F\u043A\u043E\u0441\u044C \u0432\u0456\u0434\u0433\u0443\u043A\u043D\u0435\u0442\u044C\u0441\u044F. \u041D\u0435 \u0437\u0430\u0440\u0430\u0437, \u0442\u043E \u043F\u0456\u0437\u043D\u0456\u0448\u0435.",
