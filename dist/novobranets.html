<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Новобранець</title>
<style>
  :root {
    --bg: #14140f;
    --panel: #1c1c16;
    --line: #33332a;
    --ink: #e6e2d4;
    --dim: #8d8977;
    --warn: #c9563f;
    --good: #7e9b62;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: "Georgia", "Times New Roman", serif;
    overscroll-behavior: none;
  }
  body { display: flex; flex-direction: column; min-height: 100dvh; }
  .wrap { width: 100%; max-width: 520px; margin: 0 auto; padding: 0 16px; }

  header {
    padding: 14px 0 10px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; justify-content: space-between;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px;
    color: var(--dim); letter-spacing: .06em; text-transform: uppercase;
  }
  header .day { color: var(--ink); }

  .stats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; padding: 12px 0; }
  .stat { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .stat .bar {
    width: 100%; height: 26px; background: #22221a; border-radius: 2px;
    position: relative; overflow: hidden;
  }
  .stat .fill { position: absolute; bottom: 0; left: 0; right: 0; background: var(--dim); transition: height .25s; }
  .stat .label { font-family: ui-monospace, monospace; font-size: 9px; color: var(--dim); letter-spacing: .04em; }
  .stat .val { font-family: ui-monospace, monospace; font-size: 10px; color: var(--ink); }
  .stat.pair .fill { background: var(--good); }

  main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 18px 0; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
    padding: 22px 20px; font-size: 18px; line-height: 1.55;
    min-height: 190px; display: flex; align-items: center;
    animation: in .22s ease-out;
  }
  @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .card .kind {
    position: absolute; font-family: ui-monospace, monospace; font-size: 9px;
    color: var(--dim); letter-spacing: .1em; text-transform: uppercase;
  }

  .options { display: flex; flex-direction: column; gap: 9px; margin-top: 14px; }
  button.opt {
    font: inherit; font-size: 15px; line-height: 1.4; text-align: left;
    background: #201f18; color: var(--ink); border: 1px solid var(--line);
    border-radius: 3px; padding: 13px 14px; cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  button.opt:hover { background: #282619; border-color: #4a4634; }
  button.opt:active { transform: scale(.995); }
  button.opt.locked { color: #555244; border-style: dashed; cursor: not-allowed; }
  button.opt .hint { display: block; font-size: 11px; color: var(--dim); margin-top: 5px; font-family: ui-monospace, monospace; }

  .log { font-family: ui-monospace, monospace; font-size: 11px; color: var(--dim); padding: 8px 0 4px; }
  .log div { opacity: .55; padding: 2px 0; }

  .ending { padding: 26px 20px; border: 1px solid var(--line); background: var(--panel); border-radius: 4px; }
  .ending h1 { font-size: 24px; margin: 0 0 14px; font-weight: normal; }
  .ending p { line-height: 1.6; margin: 0 0 16px; font-size: 15px; }
  .ending .ep { font-style: italic; color: var(--dim); border-left: 2px solid var(--line); padding-left: 12px; }
  .ending .meta { font-family: ui-monospace, monospace; font-size: 11px; color: var(--dim); margin-bottom: 18px; }
  a.btn, button.btn {
    display: block; width: 100%; text-align: center; text-decoration: none;
    background: var(--ink); color: var(--bg); border: 0; border-radius: 3px;
    padding: 14px; font: inherit; font-size: 15px; cursor: pointer; margin-top: 10px;
  }
  a.btn.second, button.btn.second { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .foot { font-family: ui-monospace, monospace; font-size: 10px; color: #55523f; text-align: center; padding: 12px 0 18px; }
</style>
</head>

<header class="wrap">
  <span>Новобранець</span>
  <span class="day" id="day">День 1</span>
</header>

<div class="wrap"><div class="stats" id="stats"></div></div>

<main class="wrap" id="main"></main>

<script type="module">
// src/types.ts
var STAT_KEYS = [
  "health",
  "energy",
  "supplies",
  "trust",
  "understanding",
  "bonds"
];
var STAT_RANGE = { min: 0, max: 10 };
var SKILL_KEYS = ["survival", "system", "people", "drill"];
var DEFAULT_DIRECTOR = {
  safeUntilDay: 20,
  inevitabilityStartsDay: 30,
  hardEndDay: 60,
  baseFatalChance: 0.02,
  rampPerDay: 0.015,
  maxFatalChance: 0.55
};

// src/conditions.ts
function meetsCondition(cond, stats, skills, flags, phase, day) {
  if (!cond) return true;
  if (cond.statAtLeast) {
    for (const [k, v] of Object.entries(cond.statAtLeast)) {
      if (stats[k] < v) return false;
    }
  }
  if (cond.statAtMost) {
    for (const [k, v] of Object.entries(cond.statAtMost)) {
      if (stats[k] > v) return false;
    }
  }
  if (cond.skillAtLeast) {
    for (const [k, v] of Object.entries(cond.skillAtLeast)) {
      if (skills[k] < v) return false;
    }
  }
  if (cond.flagTrue) {
    for (const f of cond.flagTrue) if (flags[f] !== true) return false;
  }
  if (cond.flagFalse) {
    for (const f of cond.flagFalse) if (flags[f] === true) return false;
  }
  if (cond.phaseAtLeast !== void 0 && phase < cond.phaseAtLeast) return false;
  if (cond.phaseAtMost !== void 0 && phase > cond.phaseAtMost) return false;
  if (cond.dayAtLeast !== void 0 && day < cond.dayAtLeast) return false;
  if (cond.dayAtMost !== void 0 && day > cond.dayAtMost) return false;
  if (cond.anySkillAtLeast) {
    const ok = cond.anySkillAtLeast.some((c) => skills[c.key] >= c.level);
    if (!ok) return false;
  }
  return true;
}
function clampStats(stats, range = STAT_RANGE) {
  const out = { ...stats };
  for (const k of STAT_KEYS) {
    out[k] = Math.max(range.min, Math.min(range.max, out[k]));
  }
  return out;
}
function applyEffect(effect, stats, skills, flags, range = STAT_RANGE) {
  if (!effect) return { stats, skills, flags };
  const nextStats = { ...stats };
  if (effect.stats) {
    for (const [k, v] of Object.entries(effect.stats)) {
      nextStats[k] += v;
    }
  }
  const nextSkills = { ...skills };
  if (effect.skills) {
    for (const [k, v] of Object.entries(effect.skills)) {
      nextSkills[k] = Math.max(0, Math.min(3, nextSkills[k] + v));
    }
  }
  const nextFlags = { ...flags };
  if (effect.flags) {
    for (const [k, v] of Object.entries(effect.flags)) nextFlags[k] = v;
  }
  return { stats: clampStats(nextStats, range), skills: nextSkills, flags: nextFlags };
}

// src/rng.ts
function nextRandom(state) {
  let t = state + 1831565813 | 0;
  let x = t;
  x = Math.imul(x ^ x >>> 15, 1 | x);
  x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x;
  const value = ((x ^ x >>> 14) >>> 0) / 4294967296;
  return { value, state: t };
}
function seedToState(seed) {
  let h = 2166136261;
  for (let i = 0; i < seed.length; i += 1) {
    h ^= seed.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function createRng(seed) {
  let state = seedToState(seed);
  const float = () => {
    const r = nextRandom(state);
    state = r.state;
    return r.value;
  };
  return {
    float,
    int: (min, max) => min + Math.floor(float() * (max - min + 1)),
    pick: (items) => {
      if (items.length === 0) throw new Error("pick() from empty array");
      return items[Math.floor(float() * items.length)];
    },
    chance: (p) => float() < p,
    state: () => state
  };
}

// src/run.ts
var PHASE_BY_DAY = [
  { until: 3, phase: 1 },
  { until: 12, phase: 2 },
  { until: 24, phase: 3 },
  { until: 40, phase: 4 },
  { until: Number.MAX_SAFE_INTEGER, phase: 5 }
];
function phaseForDay(day) {
  for (const p of PHASE_BY_DAY) if (day <= p.until) return p.phase;
  return 5;
}
var DEFAULT_STATS = {
  health: 7,
  energy: 7,
  supplies: 5,
  trust: 6,
  understanding: 2,
  bonds: 4
};
var Run = class {
  config;
  director;
  statRange;
  cardsPerDay;
  rng;
  cardsById;
  state;
  constructor(config) {
    this.config = config;
    this.director = { ...DEFAULT_DIRECTOR, ...config.director };
    this.statRange = config.statRange ?? STAT_RANGE;
    this.cardsPerDay = config.cardsPerDay ?? { min: 2, max: 3 };
    this.rng = createRng(config.seed);
    this.cardsById = new Map(config.content.cards.map((c) => [c.id, c]));
    const stats = { ...DEFAULT_STATS };
    if (config.startStats) Object.assign(stats, config.startStats);
    const skills = { survival: 0, system: 0, people: 0, drill: 0 };
    if (config.startSkills) Object.assign(skills, config.startSkills);
    this.state = {
      seed: config.seed,
      rngState: this.rng.state(),
      status: "running",
      day: 1,
      phase: 1,
      stats,
      skills,
      flags: {},
      seenCards: {},
      journal: [],
      inevitability: 0,
      decisions: 0
    };
  }
  /** Поточна картка (для UI) або null, якщо забіг завершено. */
  currentCard() {
    if (!this.state.pending) return null;
    return this.cardsById.get(this.state.pending.cardId) ?? null;
  }
  /** Доступні варіанти поточної картки. */
  availableOptions() {
    const card = this.currentCard();
    if (!card) return [];
    const s = this.state;
    return card.options.filter(
      (o) => meetsCondition(o.requires, s.stats, s.skills, s.flags, s.phase, s.day)
    );
  }
  /**
   * Підтягнути наступну картку. Викликати, коли pending === undefined.
   * Повертає картку або завершує забіг, якщо подій більше немає.
   */
  draw() {
    const s = this.state;
    if (s.status === "ended") return null;
    if (s.pending) return this.currentCard();
    if (s.day >= this.director.hardEndDay) {
      this.endWith("hardend");
      return null;
    }
    if (s.day > this.director.inevitabilityStartsDay) {
      s.inevitability += 1;
    }
    const fatalChance = this.fatalChance();
    if (s.day > this.director.safeUntilDay && this.rng.chance(fatalChance)) {
      this.endWith("accident");
      return null;
    }
    const pool = this.config.content.cards.filter((c) => this.isEligible(c));
    if (pool.length === 0) {
      this.endWith("exhausted");
      return null;
    }
    const card = this.weightedPick(pool);
    s.pending = { cardId: card.id, options: card.options.map((o) => o.id) };
    s.seenCards[card.id] = (s.seenCards[card.id] ?? 0) + 1;
    return card;
  }
  /** Обрати варіант за id. Повертає true, якщо вибір прийнято. */
  choose(optionId) {
    const s = this.state;
    const card = this.currentCard();
    if (!card || s.status === "ended") return false;
    const option = card.options.find((o) => o.id === optionId);
    if (!option) return false;
    if (!meetsCondition(option.requires, s.stats, s.skills, s.flags, s.phase, s.day)) return false;
    const applied = applyEffect(option.effects, s.stats, s.skills, s.flags, this.statRange);
    s.stats = applied.stats;
    s.skills = applied.skills;
    s.flags = applied.flags;
    if (option.conditionalEffects) {
      for (const cond of option.conditionalEffects) {
        if (meetsCondition(cond.when, s.stats, s.skills, s.flags, s.phase, s.day)) {
          const extra = applyEffect(cond.then, s.stats, s.skills, s.flags, this.statRange);
          s.stats = extra.stats;
          s.skills = extra.skills;
          s.flags = extra.flags;
        }
      }
    }
    s.journal.push({ day: s.day, cardId: card.id, optionId, text: option.text });
    s.decisions += 1;
    s.pending = void 0;
    if (s.stats.health <= 0) {
      this.endWith("wounds");
      return true;
    }
    this.advanceTime();
    return true;
  }
  advanceTime() {
    const s = this.state;
    const perDayThisDay = s.day % Math.max(1, this.cardsPerDay.min);
    const doneToday = s.journal.filter((j) => j.day === s.day).length;
    const target = this.targetCardsForDay(s.day);
    if (doneToday >= target) {
      s.day += 1;
      s.phase = phaseForDay(s.day);
      s.stats = {
        ...s.stats,
        energy: Math.max(this.statRange.min, s.stats.energy - 1),
        supplies: Math.max(this.statRange.min, s.stats.supplies - 1)
      };
    }
    if (s.day >= this.director.hardEndDay) this.endWith("hardend");
  }
  targetCardsForDay(day) {
    const { min, max } = this.cardsPerDay;
    if (max <= min) return min;
    return min + day % (max - min + 1);
  }
  fatalChance() {
    const s = this.state;
    const over = Math.max(0, s.day - this.director.inevitabilityStartsDay);
    const raw = this.director.baseFatalChance + over * this.director.rampPerDay;
    let mod = 1;
    if (s.stats.supplies <= 2) mod += 0.35;
    if (s.stats.energy <= 2) mod += 0.35;
    if (s.stats.health <= 3) mod += 0.5;
    return Math.min(this.director.maxFatalChance, raw * mod);
  }
  isEligible(card) {
    const s = this.state;
    if (!card.phase.includes(s.phase)) return false;
    if (card.once && (s.seenCards[card.id] ?? 0) > 0) return false;
    if (!meetsCondition(card.requires, s.stats, s.skills, s.flags, s.phase, s.day)) return false;
    const any = card.options.some(
      (o) => meetsCondition(o.requires, s.stats, s.skills, s.flags, s.phase, s.day)
    );
    return any;
  }
  weightedPick(pool) {
    const weights = pool.map((c) => {
      const base = c.weight ?? 1;
      const seen = this.state.seenCards[c.id] ?? 0;
      return base / (1 + seen);
    });
    const total = weights.reduce((a, b) => a + b, 0);
    let r = this.rng.float() * total;
    for (let i = 0; i < pool.length; i += 1) {
      r -= weights[i];
      if (r <= 0) return pool[i];
    }
    return pool[pool.length - 1];
  }
  endWith(reason) {
    const s = this.state;
    const ending = this.pickEnding(reason);
    s.status = "ended";
    s.pending = void 0;
    s.endingId = ending?.id ?? `fallback:${reason}`;
    s.endingReason = reason;
  }
  pickEnding(reason) {
    const s = this.state;
    const all = this.config.content.endings;
    const eligible = all.filter(
      (e) => meetsCondition(e.requires, s.stats, s.skills, s.flags, s.phase, s.day)
    );
    const byKind = eligible.filter((e) => {
      if (reason === "wounds") return e.kind === "accident" || e.kind === "quiet";
      if (reason === "hardend") return e.kind === "system";
      if (reason === "accident") return e.kind === "accident";
      return true;
    });
    const pool = byKind.length > 0 ? byKind : eligible;
    if (pool.length === 0) return void 0;
    const total = pool.reduce((a, e) => a + (e.weight ?? 1), 0);
    let r = this.rng.float() * total;
    for (const e of pool) {
      r -= e.weight ?? 1;
      if (r <= 0) return e;
    }
    return pool[pool.length - 1];
  }
  ending() {
    const id = this.state.endingId;
    if (!id) return void 0;
    return this.config.content.endings.find((e) => e.id === id);
  }
  /** Знімок для збереження/тестів. */
  snapshot() {
    return JSON.parse(JSON.stringify(this.state));
  }
  /** Перевірка цілісності стану (для автотестів). */
  validate() {
    const errors = [];
    const s = this.state;
    for (const k of SKILL_KEYS) {
      if (s.skills[k] < 0 || s.skills[k] > 3) errors.push(`skill ${k} out of range: ${s.skills[k]}`);
    }
    for (const [k, v] of Object.entries(s.stats)) {
      if (v < this.statRange.min || v > this.statRange.max) errors.push(`stat ${k} out of range: ${v}`);
    }
    if (s.status === "ended" && !s.endingId) errors.push("ended without endingId");
    if (s.status === "running" && s.decisions > 500) errors.push("run too long");
    return errors;
  }
};

// web/app.js
var STAT_LABELS = {
  health: "\u0417\u0434\u043E\u0440",
  energy: "\u0411\u0430\u0434\u044C",
  supplies: "\u0417\u0430\u043F",
  trust: "\u0414\u043E\u0432",
  understanding: "\u0420\u043E\u0437",
  bonds: "\u0417\u0432'\u044F\u0437"
};
var KIND_LABELS = {
  event: "\u043F\u043E\u0434\u0456\u044F",
  routine: "\u043F\u043E\u0431\u0443\u0442",
  person: "\u043B\u044E\u0434\u0438\u043D\u0430",
  system: "\u0441\u0438\u0441\u0442\u0435\u043C\u0430",
  final: "\u0444\u0456\u043D\u0430\u043B"
};
var elDay = document.getElementById("day");
var elStats = document.getElementById("stats");
var elMain = document.getElementById("main");
var elLog = document.getElementById("log");
var run = new Run({
  seed: newSeed(),
  content: { cards: TEST_CARDS, endings: TEST_ENDINGS }
});
function newSeed() {
  return Math.random().toString(36).slice(2, 10);
}
function renderStats() {
  const s = run.state.stats;
  elStats.innerHTML = Object.keys(STAT_LABELS).map((k) => {
    const v = s[k];
    const pct = v / 10 * 100;
    const pair = k === "trust" || k === "understanding" ? " pair" : "";
    return `<div class="stat${pair}">
      <div class="bar"><div class="fill" style="height:${pct}%"></div></div>
      <div class="label">${STAT_LABELS[k]}</div>
    </div>`;
  }).join("");
}
function renderLog() {
  const last = run.state.journal.slice(-3).reverse();
  elLog.innerHTML = last.map((j) => `<div>\u0434${j.day} \xB7 ${escapeHtml(j.text)}</div>`).join("");
}
function escapeHtml(t) {
  return String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}
function render() {
  elDay.textContent = `\u0414\u0435\u043D\u044C ${run.state.day} \xB7 \u0444\u0430\u0437\u0430 ${run.state.phase}`;
  renderStats();
  renderLog();
  if (run.state.status === "ended") return renderEnding();
  const card = run.draw();
  if (!card) return renderEnding();
  const available = new Set(run.availableOptions().map((o) => o.id));
  elMain.innerHTML = `
    <div class="card" style="position:relative">
      <span class="kind" style="top:10px;left:12px">${KIND_LABELS[card.kind] ?? ""}</span>
      <div>${escapeHtml(card.text)}</div>
    </div>
    <div class="options">
      ${card.options.map(
    (o) => available.has(o.id) ? `<button class="opt" data-opt="${escapeHtml(o.id)}">${escapeHtml(o.text)}</button>` : `<button class="opt locked" disabled>${escapeHtml(o.text)}<span class="hint">${escapeHtml(o.lockedHint ?? "\u043D\u0435\u0434\u043E\u0441\u0442\u0443\u043F\u043D\u043E")}</span></button>`
  ).join("")}
    </div>
  `;
  elMain.querySelectorAll("button.opt[data-opt]").forEach((btn) => {
    btn.addEventListener("click", () => {
      if (run.choose(btn.dataset.opt)) render();
    });
  });
}
function renderEnding() {
  const e = run.ending();
  const st = run.state;
  const title = e?.title ?? "\u041A\u0456\u043D\u0435\u0446\u044C";
  const epilogue = e?.epilogue ?? "\u0417\u0430\u0431\u0456\u0433 \u043E\u0431\u0456\u0440\u0432\u0430\u0432\u0441\u044F \u0431\u0435\u0437 \u0437\u0430\u043F\u0438\u0441\u0430\u043D\u043E\u0433\u043E \u0444\u0456\u043D\u0430\u043B\u0443.";
  const epitaph = e?.defaultEpitaph ?? "";
  elMain.innerHTML = `
    <div class="ending">
      <div class="meta">${title} \xB7 \u0434\u0435\u043D\u044C ${st.day} \xB7 ${st.decisions} \u0440\u0456\u0448\u0435\u043D\u044C</div>
      <h1>${escapeHtml(title)}</h1>
      <p class="ep">${escapeHtml(epitaph)}</p>
      <p>${escapeHtml(epilogue)}</p>
      <div class="meta">
        \u0420\u043E\u0437\u0443\u043C\u0456\u043D\u043D\u044F ${st.stats.understanding}/10 \xB7 \u0417\u0432'\u044F\u0437\u043A\u0438 ${st.stats.bonds}/10 \xB7
        \u0412\u0438\u0436\u0438\u0432\u0430\u043D\u043D\u044F ${st.skills.survival} \xB7 \u0421\u0438\u0441\u0442\u0435\u043C\u0430 ${st.skills.system} \xB7
        \u041B\u044E\u0434\u0438 ${st.skills.people} \xB7 \u041C\u0443\u0448\u0442\u0440\u0430 ${st.skills.drill}
      </div>
      <button class="btn" id="again">\u041F\u0440\u043E\u0436\u0438\u0442\u0438 \u0449\u0435 \u0440\u0430\u0437</button>
      <button class="btn second" id="same">\u0422\u043E\u0439 \u0441\u0430\u043C\u0438\u0439 \u0448\u043B\u044F\u0445 (seed ${escapeHtml(st.seed)})</button>
    </div>
  `;
  document.getElementById("again").addEventListener("click", () => {
    run = new Run({ seed: newSeed(), content: { cards: TEST_CARDS, endings: TEST_ENDINGS } });
    render();
  });
  document.getElementById("same").addEventListener("click", () => {
    run = new Run({ seed: st.seed, content: { cards: TEST_CARDS, endings: TEST_ENDINGS } });
    render();
  });
}
render();

</script>
